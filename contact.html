<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | AL-NOOR Centre Educatiu Asiàtic</title>
  <meta name="description" content="Contacta con AL-NOOR en Barcelona para información sobre cursos, preparación de exámenes y apoyo educativo.">
  <meta name="theme-color" content="#073b2f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contacto | AL-NOOR">
  <meta property="og:description" content="Estamos aquí para ayudarte a elegir el curso adecuado.">
  <meta property="og:image" content="logo.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#075e48;--green-dark:#063b30;--green-soft:#eaf7f2;--gold:#e8b13f;--ink:#14231f;--muted:#61706b;--line:#dce8e3;--white:#fff;--shadow:0 20px 50px rgba(7,59,47,.11)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#f7faf9;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;line-height:1.65}
    a{color:inherit}
    button,a{-webkit-tap-highlight-color:transparent}
    .skip-link{position:fixed;left:16px;top:-60px;z-index:999;background:#fff;padding:10px 16px;border-radius:10px}
    .skip-link:focus{top:16px}
    .site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,232,227,.9)}
    .nav-wrap{max-width:1180px;height:78px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;letter-spacing:-.03em}
    .brand img{width:156px;height:auto;max-height:54px;object-fit:contain}
    .brand-fallback{display:none;color:var(--green-dark);font-size:22px}
    .menu-toggle{display:none}
    .menu-button{display:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
    .nav-links{display:flex;align-items:center;gap:5px}
    .nav-links a{padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:600;color:#44534e}
    .nav-links a:hover,.nav-links a[aria-current="page"]{background:var(--green-soft);color:var(--green)}
    .hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#052e25 0%,#08644c 65%,#0b775b 100%);color:#fff}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
    .hero:before{width:440px;height:440px;right:-150px;top:-210px}
    .hero:after{width:270px;height:270px;left:-120px;bottom:-170px}
    .hero-inner{position:relative;max-width:1180px;margin:auto;padding:76px 24px 112px;display:grid;grid-template-columns:1.25fr .75fr;gap:60px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;color:#d8f6eb;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
    .eyebrow:before{content:"";width:28px;height:2px;background:var(--gold)}
    h1{max-width:700px;margin:0;font-size:clamp(42px,6vw,72px);line-height:1.04;letter-spacing:-.055em}
    .hero-copy{max-width:650px;margin:24px 0 30px;color:#d8e8e2;font-size:18px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:12px 18px;border:1px solid transparent;border-radius:13px;text-decoration:none;font-weight:800;transition:transform .2s,box-shadow .2s,background .2s}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:#fff;color:var(--green-dark);box-shadow:0 12px 30px rgba(0,0,0,.14)}
    .btn-secondary{border-color:rgba(255,255,255,.3);color:#fff;background:rgba(255,255,255,.08)}
    .hero-note{padding:26px;border:1px solid rgba(255,255,255,.15);border-radius:22px;background:rgba(255,255,255,.08);box-shadow:0 16px 40px rgba(0,0,0,.12)}
    .hero-note strong{display:block;font-size:18px;margin-bottom:7px}
    .hero-note p{margin:0;color:#d8e8e2;font-size:14px}
    .status{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:13px;font-weight:700;color:#c8f5df}
    .status-dot{width:9px;height:9px;border-radius:50%;background:#55dd9c;box-shadow:0 0 0 6px rgba(85,221,156,.13)}
    main{max-width:1180px;margin:-56px auto 0;padding:0 24px 84px;position:relative}
    .contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .contact-card{position:relative;display:flex;flex-direction:column;min-height:250px;padding:28px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
    .contact-card.featured{grid-column:span 2;background:linear-gradient(120deg,#fff 0%,#f2fbf7 100%)}
    .contact-card.featured:after{content:"";position:absolute;width:190px;height:190px;right:-70px;bottom:-100px;border-radius:50%;background:#daf2e7}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;position:relative;z-index:1}
    .icon{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:14px;background:var(--green-soft);color:var(--green)}
    .icon svg{width:24px;height:24px;fill:currentColor}
    .tag{padding:5px 9px;border-radius:999px;background:#fff5d8;color:#78570a;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .contact-card h2{margin:20px 0 5px;font-size:23px;line-height:1.2;letter-spacing:-.025em}
    .contact-card p{margin:0 0 22px;color:var(--muted);font-size:14px}
    .contact-card .number{display:block;margin-top:7px;color:var(--ink);font-size:16px;font-weight:800;letter-spacing:.02em}
    .card-link{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:auto;color:var(--green);font-weight:800;text-decoration:none}
    .card-link:hover{text-decoration:underline;text-underline-offset:4px}
    .content-section{margin-top:72px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:26px}
    .section-head h2{margin:0;font-size:clamp(30px,4vw,44px);letter-spacing:-.045em;line-height:1.1}
    .section-head p{max-width:530px;margin:0;color:var(--muted)}
    .language-tabs{display:flex;gap:8px;padding:6px;width:max-content;max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#edf4f1}
    .language-tabs button{border:0;border-radius:9px;padding:9px 16px;background:transparent;color:#53635d;font:700 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
    .language-tabs button[aria-selected="true"]{background:#fff;color:var(--green);box-shadow:0 4px 12px rgba(7,59,47,.09)}
    .language-panel{margin-top:22px;padding:clamp(24px,5vw,48px);border:1px solid var(--line);border-radius:24px;background:#fff}
    .language-panel[hidden]{display:none}
    .language-panel h3{margin:0 0 10px;font-size:28px;letter-spacing:-.035em}
    .language-panel>p{max-width:850px;color:var(--muted)}
    .support-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0 0;padding:0;list-style:none}
    .support-list li{padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;font-size:14px;font-weight:650}
    .support-list li:before{content:"✓";color:var(--green);font-weight:900;margin-right:9px}
    [dir="rtl"]{font-family:"Noto Nastaliq Urdu",serif}
    [dir="rtl"] .support-list li:before{margin:0 0 0 9px}
    .visit-banner{display:grid;grid-template-columns:1fr auto;align-items:center;gap:30px;margin-top:32px;padding:30px;border-radius:22px;background:var(--green-dark);color:#fff}
    .visit-banner h3{margin:0 0 6px;font-size:24px}
    .visit-banner p{margin:0;color:#bdd5cc}
    .footer{padding:30px 24px 100px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px}
    .whatsapp-float{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:10px;padding:13px 17px;border-radius:999px;background:#1fa855;color:#fff;text-decoration:none;font-size:14px;font-weight:800;box-shadow:0 15px 32px rgba(16,118,60,.28)}
    .whatsapp-float:hover{transform:translateY(-2px)}
    .whatsapp-float svg{width:22px;height:22px;fill:currentColor}
    :focus-visible{outline:3px solid #efb73f;outline-offset:3px}
    @media(max-width:800px){.nav-wrap{height:68px}.brand img{width:128px}.menu-button{display:block}.nav-links{display:none;position:absolute;left:16px;right:16px;top:67px;padding:12px;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}.nav-links a{padding:12px}.menu-toggle:checked~.nav-links{display:flex}.hero-inner{grid-template-columns:1fr;padding-top:54px;padding-bottom:92px}.hero-note{display:none}.contact-grid{grid-template-columns:1fr}.contact-card.featured{grid-column:span 1}.section-head{display:block}.section-head p{margin-top:12px}.support-list{grid-template-columns:1fr 1fr}.visit-banner{grid-template-columns:1fr}.visit-banner .btn{width:100%}}
    @media(max-width:520px){.nav-wrap,main,.hero-inner{padding-left:16px;padding-right:16px}h1{font-size:42px}.hero-copy{font-size:16px}.hero-actions .btn{width:100%}.contact-card{padding:22px;min-height:230px}.support-list{grid-template-columns:1fr}.language-panel{border-radius:18px}.whatsapp-float{right:12px;bottom:12px}.whatsapp-float span{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
