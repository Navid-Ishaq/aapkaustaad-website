project_id = "aapkaustaad-student-chat"

[auth]
enabled = true
site_url = "https://aapkaustaad.com"
additional_redirect_urls = ["https://www.aapkaustaad.com/student-chat.html"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
enable_confirmations = true

# Functions validate bearer tokens with Auth getUser themselves, including new signing keys.
[functions.chat-admin]
verify_jwt = false

[functions.chat-password]
verify_jwt = false

[functions.chat-media]
verify_jwt = false
